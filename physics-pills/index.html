<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Physics Stacking Pills</title>
    
    <!-- Load Matter.js Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script> 
 
    <style> 
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
        } 
 
        body { 
            background-color: #000000; 
            color: white; 
            overflow: hidden; 
        } 
 
        /* Main Section */ 
        .creative-section { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
        } 
 
        /* The container where physics elements live */ 
        #physics-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
        } 
 
        /* The Stacking Pills/Tags - Default (Desktop) */ 
        .pill { 
            position: absolute; 
            padding: 18px 40px; 
            border-radius: 50px; 
            font-size: 1.4rem; 
            font-weight: 800; 
            background-color: #FFFFFF; 
            color: #000000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            transform-origin: center center; 
            will-change: transform; 
            cursor: pointer; 
            user-select: none; 
            letter-spacing: 1px; 
            white-space: nowrap; /* Prevents text wrapping inside the pill */ 
        } 
 
        /* Specific Colors */ 
        .pill.orange { background-color: #FF5C00; color: #000; } 
        .pill.white  { background-color: #FFFFFF; color: #000; } 
 
        /* Tablet Responsiveness */ 
        @media (max-width: 768px) { 
            .pill { 
                padding: 14px 30px; 
                font-size: 1.1rem; 
                letter-spacing: 0.5px; 
            } 
        } 
 
        /* Mobile Responsiveness */ 
        @media (max-width: 480px) { 
            .pill { 
                padding: 10px 20px; 
                font-size: 0.9rem; 
                letter-spacing: 0px; 
            } 
        } 
    </style> 
</head> 
<body> 
 
    <section class="creative-section"> 
        <!-- Physics Boxes Go Here --> 
        <div id="physics-container"></div> 
    </section> 
 
    <script> 
        // 1. Setup Matter.js Engine 
        const { Engine, Runner, World, Bodies, Body, Events } = Matter; 
         
        const engine = Engine.create(); 
        const runner = Runner.create(); 
        const world = engine.world; 
         
        engine.gravity.y = 1; 
 
        const container = document.getElementById('physics-container'); 
        let width = window.innerWidth; 
        let height = window.innerHeight; 
 
        // 2. Create Invisible Boundaries (Floor and Walls) 
        const boundaries = [ 
            // Floor 
            Bodies.rectangle(width / 2, height + 30, width * 2, 60, { isStatic: true }), 
            // Left Wall 
            Bodies.rectangle(-30, height / 2, 60, height * 2, { isStatic: true }), 
            // Right Wall 
            Bodies.rectangle(width + 30, height / 2, 60, height * 2, { isStatic: true }) 
        ]; 
        World.add(world, boundaries); 
 
        // 3. Data for the Pills 
        let pillData = [ 
            { text: "AmsBees", class: "orange" }, 
            { text: "RedFry", class: "white" }, 
            { text: "Tratak", class: "orange" }, 
            { text: "Cinch Eots", class: "white" }, 
            { text: "Wakao", class: "orange" }, 
            { text: "Meraki", class: "white" }, 
            { text: "Hi - Choice", class: "orange" }, 
            { text: "Pickle", class: "white" }, 
            { text: "IDEOGRAPHY", class: "orange" }, 
            { text: "Progressive", class: "white" }, 
            { text: "AmsBees", class: "white" }, 
            { text: "RedFry", class: "orange" }, 
            { text: "Tratak", class: "white" }, 
            { text: "Cinch Eots", class: "orange" }, 
            { text: "Wakao", class: "white" }, 
            { text: "Meraki", class: "orange" }, 
            { text: "Hi - Choice", class: "white" }, 
            { text: "Pickle", class: "orange" } 
        ]; 
 
        // If on mobile, reduce the number of pills so the screen doesn't overfill 
        if (width < 768) { 
            pillData = pillData.slice(0, 12);  
        } 
 
        const pills = []; 
 
        // 4. Create DOM Elements and Physics Bodies 
        pillData.forEach((data, index) => { 
            const el = document.createElement('div'); 
            el.className = `pill ${data.class}`; 
            el.textContent = data.text; 
            container.appendChild(el); 
 
            // Wait for DOM to render to get accurate width/height based on CSS media queries 
            requestAnimationFrame(() => { 
                const w = el.offsetWidth; 
                const h = el.offsetHeight; 
                 
                // Ensure boxes don't spawn outside the screen on mobile 
                const maxX = Math.max(w + 20, width - w - 20); 
                const startX = Math.random() * (maxX - 20) + 20; 
                 
                // Stagger their fall from the top 
                const startY = -200 - (index * 150); 
 
                const body = Bodies.rectangle(startX, startY, w, h, { 
                    friction: 0.8, 
                    restitution: 0.1, 
                    density: 0.002 
                }); 
 
                Body.setAngle(body, (Math.random() - 0.5) * 0.8); 
                 
                World.add(world, body); 
                pills.push({ body, element: el, w, h }); 
 
                // 5. Interaction: Shake/Move on Hover or Touch 
                const interact = () => { 
                    const force = {  
                        x: (Math.random() - 0.5) * 0.2,  
                        y: -0.2 - Math.random() * 0.1  
                    }; 
                    Body.applyForce(body, body.position, force); 
                    Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.8); 
                }; 
 
                el.addEventListener('mouseenter', interact); 
                el.addEventListener('touchstart', (e) => { 
                    e.preventDefault(); 
                    interact(); 
                }); 
            }); 
        }); 
 
        // 6. Sync Physics Engine to DOM Elements 
        Events.on(engine, 'afterUpdate', () => { 
            pills.forEach(p => { 
                const { body, element, w, h } = p; 
                const x = body.position.x - w / 2; 
                const y = body.position.y - h / 2; 
                const angle = body.angle; 
                 
                element.style.transform = `translate(${x}px, ${y}px) rotate(${angle}rad)`; 
            }); 
        }); 
 
        // 7. Run the Engine 
        Runner.run(runner, engine); 
 
        // 8. Handle Window Resize (Update walls) 
        window.addEventListener('resize', () => { 
            width = window.innerWidth; 
            height = window.innerHeight; 
             
            // Reposition the floor and walls when screen rotates or resizes 
            Body.setPosition(boundaries[0], { x: width / 2, y: height + 30 }); 
            Body.setPosition(boundaries[1], { x: -30, y: height / 2 }); 
            Body.setPosition(boundaries[2], { x: width + 30, y: height / 2 }); 
        }); 
    </script> 
</body> 
</html>
